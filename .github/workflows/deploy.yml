name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:  # permet de relancer manuellement depuis l'onglet Actions

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY:    ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d7honqiqqhas738lndn0
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::Le secret RENDER_API_KEY doit être défini dans GitHub Settings → Secrets."
            exit 1
          fi

          echo "→ Déclenchement du déploiement Render pour le service $RENDER_SERVICE_ID"

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP $http_code"
          echo "$body"

          # Render renvoie 201 (created) ou 202 (accepted) en cas de succès
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ] && [ "$http_code" != "202" ]; then
            echo "::error::Échec du déploiement Render (HTTP $http_code)"
            exit 1
          fi

          echo "✅ Déploiement Render déclenché avec succès (HTTP $http_code)"
