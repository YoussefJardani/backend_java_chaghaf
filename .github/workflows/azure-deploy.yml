name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main, master ]
    paths:
      - 'chaghaf-monolith/**'
      - '.github/workflows/azure-deploy.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'chaghaf-monolith/**'
  workflow_dispatch:

env:
  RESOURCE_GROUP:  rg-chaghaf
  CONTAINER_APP:   app-chaghaf
  IMAGE_NAME:      chaghaf-monolith
  DOCKERFILE_PATH: chaghaf-monolith/Dockerfile
  BUILD_CONTEXT:   chaghaf-monolith

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        working-directory: chaghaf-monolith
        run: mvn clean package -DskipTests -B --no-transfer-progress

      - name: Verify JAR
        run: |
          ls -lh chaghaf-monolith/target/*.jar
          echo "JAR built successfully"

  deploy:
    name: Docker -> ACR -> Azure Container Apps
    runs-on: ubuntu-latest
    needs: build
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login ACR
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username:     ${{ secrets.ACR_USERNAME }}
          password:     ${{ secrets.ACR_PASSWORD }}

      - name: Compute image tag
        id: image-tag
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TIMESTAMP=$(date +%Y%m%d%H%M)
          echo "tag=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "latest=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image-tag.outputs.tag }}" \
            -t "${{ steps.image-tag.outputs.latest }}" \
            -f ${{ env.DOCKERFILE_PATH }} \
            ${{ env.BUILD_CONTEXT }}

      - name: Push to ACR
        run: |
          docker push "${{ steps.image-tag.outputs.tag }}"
          docker push "${{ steps.image-tag.outputs.latest }}"

      - name: Deploy to Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup:    ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP }}
          imageToDeploy:    ${{ steps.image-tag.outputs.tag }}
          registryUrl:      ${{ secrets.ACR_LOGIN_SERVER }}
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}

      - name: Get app URL
        id: app-url
        run: |
          URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "url=https://$URL" >> "$GITHUB_OUTPUT"
          echo "App URL: https://$URL"

      - name: Health check
        run: |
          echo "Waiting 30s for app startup..."
          sleep 30
          MAX=10
          URL="${{ steps.app-url.outputs.url }}"
          for i in $(seq 1 $MAX); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/actuator/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check OK"
              exit 0
            fi
            echo "Attempt $i/$MAX: $STATUS — retry in 15s"
            sleep 15
          done
          echo "::error::Health check failed after $MAX attempts"
          exit 1

      - name: Deployment summary
        run: |
          echo "## Deployment Chaghaf" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ steps.app-url.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ steps.image-tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
