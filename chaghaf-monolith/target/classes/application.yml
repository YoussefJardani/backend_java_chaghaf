server:
  port: ${PORT:8080}

spring:
  application:
    name: chaghaf-monolith
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chaghaf_bd}
    username: ${DB_USER:chaghaf_bd_user}
    password: ${DB_PASS:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  mvc:
    async:
      request-timeout: -1

jwt:
  secret: ${JWT_SECRET:chaghaf-super-secret-key-2025-agadir-morocco-production-min-256-bits-long}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
