server:
  port: ${PORT:8080}

spring:
  application:
    name: chaghaf-monolith

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chaghaf_bd}${DB_SSL_PARAMS:}
    username: ${DB_USER:chaghaf_bd_user}
    password: ${DB_PASS:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # ── Flyway (migrations DB versionnées) ────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true   # accepte les DBs existantes (Render/Azure déjà peuplées)
    baseline-version: 0
    validate-on-migrate: true

  # ── JPA : Hibernate ne touche plus le schéma — Flyway s'en charge
  jpa:
    hibernate:
      ddl-auto: none            # validate plus tard quand stable
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: Africa/Casablanca

  mvc:
    async:
      request-timeout: -1

jwt:
  # PAS de fallback : JWT_SECRET DOIT être défini en env var.
  # JwtService crash au démarrage si manquant ou < 32 bytes.
  secret: ${JWT_SECRET:}
  expiration: 86400000

# CORS — par défaut "*" (dev); en prod mettre la liste des origines autorisées
# Ex Azure: az containerapp update --set-env-vars CORS_ALLOWED_ORIGINS="https://app.chaghaf.ma,exp://..."
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

logging:
  level:
    root: WARN
    ma.chaghaf: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# Profil PROD (activé via SPRING_PROFILES_ACTIVE=prod sur Azure)
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
logging:
  level:
    root: WARN
    ma.chaghaf: INFO
